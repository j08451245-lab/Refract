<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Refract</title><script>
(function(){
  var base = location.pathname.indexOf('/Refract/') === 0 ? '/Refract/' : '/';
  var p = location.pathname.slice(base.length);
  if (!p) { location.replace(base); return; }
  if (/\.[a-z0-9]+$/i.test(p) || p.indexOf('/') > -1 && !/\.[a-z0-9]+$/i.test(p)) { location.replace(base + p); return; }
  location.replace(base + p + '.html');
})();
</script></head><body style="background:#0a0a0a;color:#666;font-family:sans-serif">Redirectingâ€¦</body></html>
