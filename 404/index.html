<!DOCTYPE html>

        <!--=============== BOXICONS ===============-->
        <link href='https://unpkg.com/boxicons@2.1.2/css/boxicons.min.css' rel='stylesheet'>

        <!--=============== CSS ===============-->
        <link rel="stylesheet" href="assets/css/styles.css">

        <title>Responsive 404 website - Bedimcode</title>
    </head>
    <body>
        <!--==================== HEADER ====================-->
        <header class="header">
            <nav class="nav container">
                <a href="#" class="nav__logo">
                    XCOMPANY
                </a>

                <div class="nav__menu" id="nav-menu">
                    <ul class="nav__list">
                        <li class="nav__item">
                            <a href="#" class="nav__link">Home</a>
                        </li>
                        <li class="nav__item">
                            <a href="#" class="nav__link">About</a>
                        </li>
                        <li class="nav__item">
                            <a href="#" class="nav__link">Contact</a>
                        </li>
                    </ul>

                    <div class="nav__close" id="nav-close">
                        <i class='bx bx-x'></i>
                    </div>
                </div>

                <!-- Toggle button -->
                <div class="nav__toggle" id="nav-toggle">
                    <i class='bx bx-grid-alt'></i>
                </div>
            </nav>
        </header>

        <!--==================== MAIN ====================-->
        <main class="main">
            <!--==================== HOME ====================-->
            <section class="home">
                <div class="home__container container">
                    <div class="home__data">
                        <span class="home__subtitle">Error 404</span>
                        <h1 class="home__title">Hey Buddy</h1>
                        <p class="home__description">
                            We can't seem to find the page <br> you are looking for.
                        </p>
                        <a href="#" class="home__button">
                            Go Home
                        </a>
                    </div>

                    <div class="home__img">
                        <img src="assets/img/ghost-img.png" alt="">
                        <div class="home__shadow"></div>
                    </div>
                </div>

                <footer class="home__footer">
                    <span>(554) 987-654</span>
                    <span>|</span>
                    <span>info@company.com</span>
                </footer>
            </section>
        </main>

        <!--=============== SCROLLREVEAL ===============-->
        <script src="assets/js/scrollreveal.min.js"></script>

        <!--=============== MAIN JS ===============-->
        <script src="assets/js/main.js"></script>
    <script>
(function(){
  var B = location.pathname.indexOf('/Refract/')===0 ? '/Refract' : '';
  function okAttr(v){
    return v && typeof v === 'string' && v.charAt(0) === '/' && v.charAt(1) !== '/' && !(B && v.indexOf(B + '/') === 0);
  }
  function fixSet(el, a){
    var v = el.getAttribute(a);
    if (!v) return;
    if (v.indexOf(',') > -1) {
      var out = v.split(',').map(function(tok){
        var t = tok.replace(/^\s+|\s+$/g, '');
        var sp = t.indexOf(' ');
        var u = sp > -1 ? t.slice(0, sp) : t;
        var d = sp > -1 ? t.slice(sp + 1) : '';
        if (okAttr(u)) u = B + u;
        return d ? (u + ' ' + d) : u;
      }).join(', ');
      el.setAttribute(a, out);
    } else if (okAttr(v)) {
      el.setAttribute(a, B + v);
    }
  }
  function fix(el){
    if (!el || !el.getAttribute) return;
    fixSet(el, 'src'); fixSet(el, 'srcset'); fixSet(el, 'poster');
    var st = el.getAttribute('style');
    if (st && st.indexOf('url(/') > -1) {
      el.setAttribute('style', st.replace(/url\(\s*(["']?)\/((?:_next|images|videos|patterns|animations|favicon)[^\s)"']*)/g, function(m,q,d){ return 'url(' + q + B + '/' + d; }));
    }
  }
  function sweep(){
    try {
      var ns = document.querySelectorAll('[src],[srcset],[poster],[style]');
      for (var i = 0; i < ns.length; i++) fix(ns[i]);
    } catch (e) {}
  }
  sweep();
  try {
    var ob = new MutationObserver(function(ms){
      for (var i = 0; i < ms.length; i++){
        var m = ms[i];
        fix(m.target);
        if (m.addedNodes && m.addedNodes.length) {
          for (var j = 0; j < m.addedNodes.length; j++){
            var n = m.addedNodes[j];
            if (n.nodeType === 1) { fix(n); if (n.querySelectorAll){ var q = n.querySelectorAll('[src],[srcset],[poster],[style]'); for (var k = 0; k < q.length; k++) fix(q[k]); } }
          }
        }
      }
    });
    ob.observe(document.documentElement, {attributes:true, attributeFilter:['src','srcset','poster','style'], subtree:true, childList:true});
  } catch (e) {}
  [80, 400, 1200, 2500].forEach(function(t){ setTimeout(sweep, t); });
  window.addEventListener('load', sweep);
})();
</script></body>
</html>
